version: '3.8'

services:
  api:
    build: .
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URL=mongodb://mongo:27017/subscription_billing
      - JWT_SECRET=my_super_secret_subscription_jwt_key
      - JWT_ACCESS_EXPIRATION_MINUTES=60
      - WEBHOOK_SECRET=my_webhook_secret
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
